; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:newESPDevice]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
lib_deps = 
	links2004/WebSockets@^2.4.1
	ayushsharma82/ElegantOTA@^3.1.5
	ESP8266WiFi
	Hash
	mysensors/MySensors NodeManager@^1.8.0
	adafruit/DHT sensor library@^1.4.6
	mihai-dinculescu/Gravity Soil Moisture Sensor@^1.0.0
	adafruit/Adafruit VEML7700 Library@^2.1.6
	adafruit/Adafruit LC709203F@^1.3.4
	wilmouths/RGB@^1.0.10
	bblanchon/ArduinoJson@^7.4.2
build_flags = 
	-I/usr/include/mysql
	-I/usr/include/mysql-cppconn-8
	-Wno-deprecated-declarations
	-L/usr/lib
board_build.filesystem = littlefs

[env:newESPDevice_OTA]
extends = env:newESPDevice
upload_protocol = espota
upload_port = 192.168.1.240
upload_flags = 
	--port=8266
	--auth=
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@^7.4.2
