; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:newESPDevice]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
lib_deps = 
	links2004/WebSockets@^2.4.1
	bblanchon/ArduinoJson@^7.0.4
	ayushsharma82/ElegantOTA@^3.1.5
	ESP8266WiFi
	Hash
	; khoih-prog/MySQL_MariaDB_Generic@^1.7.2
	chuckbell/MySQL Connector Arduino@^1.2.0
build_flags = 
	-I/usr/include/mysql
	-I/usr/include/mysql-cppconn-8
	-L/usr/lib
board_build.filesystem = littlefs

[env:newESPDevice_OTA]
extends = env:newESPDevice
upload_protocol = espota
upload_port = 192.168.1.179
upload_flags = 
	--port=8266
	--auth=
monitor_speed = 115200
lib_deps = 
	mysensors/MySensors NodeManager@^1.8.0
	chuckbell/MySQL Connector Arduino@^1.2.0
