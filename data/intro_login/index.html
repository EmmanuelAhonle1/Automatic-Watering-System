<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
    <link rel="stylesheet" href="/intro_login/styles.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bcryptjs/2.4.3/bcrypt.min.js"></script>
  </head>
  <body>
    <div class="container">
      <div class="login-box">
        <h2>Welcome Back</h2>
        <form id="loginForm" onsubmit="return validateForm(event)">
          <div class="input-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required />
            <span class="error" id="usernameError"></span>
          </div>

          <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required />
            <span class="error" id="passwordError"></span>
          </div>

          <div class="remember-me">
            <input type="checkbox" id="remember" name="remember" />
            <label for="remember">Remember me</label>
          </div>

          <button type="submit">Login</button>

          <div class="links">
            <a href="#" onclick="toggleForms()">Sign Up</a>
          </div>
        </form>

        <form
          id="signupForm"
          onsubmit="return validateSignupForm(event)"
          style="display: none"
        >
          <div class="input-group">
            <label for="signupUsername">Username</label>
            <input
              type="text"
              id="signupUsername"
              name="signupUsername"
              required
            />
            <span class="error" id="signupUsernameError"></span>
          </div>

          <div class="input-group">
            <label for="signupEmail">Email</label>
            <input type="email" id="signupEmail" name="signupEmail" required />
            <span class="error" id="signupEmailError"></span>
          </div>

          <div class="input-group">
            <label for="signupPassword">Password</label>
            <input
              type="password"
              id="signupPassword"
              name="signupPassword"
              required
            />
            <span class="error" id="signupPasswordError"></span>
          </div>

          <div class="input-group">
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" name="firstName" required />
            <span class="error" id="firstNameError"></span>
          </div>

          <div class="input-group">
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" name="lastName" required />
            <span class="error" id="lastNameError"></span>
          </div>

          <div class="input-group">
            <label for="phoneNumber">Phone Number</label>
            <input type="tel" id="phoneNumber" name="phoneNumber" required />
            <span class="error" id="phoneNumberError"></span>
          </div>

          <div class="input-group">
            <label for="temperatureUnit">Preferred Temperature Unit</label>
            <select id="temperatureUnit" name="temperatureUnit" required>
              <option value="C">Celsius</option>
              <option value="F">Fahrenheit</option>
            </select>
            <span class="error" id="temperatureUnitError"></span>
          </div>

          <button type="submit">Sign Up</button>

          <div class="links">
            <a href="#" onclick="toggleForms()">Back to Login</a>
          </div>
        </form>
      </div>
    </div>
    <script src="/intro_login/script.js"></script>
  </body>
</html>
